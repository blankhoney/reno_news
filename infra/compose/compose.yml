services:
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    environment:
      API_BASE_URL: http://api:3001
      WORKER_BASE_URL: http://worker:3002
    volumes:
      - ../../apps:/app/apps
      - ../../packages:/app/packages
      - ../../package.json:/app/package.json:ro
      - ../../pnpm-lock.yaml:/app/pnpm-lock.yaml:ro
      - ../../pnpm-workspace.yaml:/app/pnpm-workspace.yaml:ro
      - ../../tsconfig.base.json:/app/tsconfig.base.json:ro
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: "3001"
      HOST: "0.0.0.0"
      DATABASE_URL: postgres://reno_news:reno_news@postgres:5432/reno_news
    volumes:
      - ../../apps:/app/apps
      - ../../packages:/app/packages
      - ../../package.json:/app/package.json:ro
      - ../../pnpm-lock.yaml:/app/pnpm-lock.yaml:ro
      - ../../pnpm-workspace.yaml:/app/pnpm-workspace.yaml:ro
      - ../../tsconfig.base.json:/app/tsconfig.base.json:ro
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  worker:
    build:
      context: ../..
      dockerfile: services/worker/Dockerfile
    environment:
      PORT: "3002"
      HOST: "0.0.0.0"
      DATABASE_URL: postgres://reno_news:reno_news@postgres:5432/reno_news
    volumes:
      - ../../services/worker/pyproject.toml:/app/pyproject.toml:ro
      - ../../services/worker/uv.lock:/app/uv.lock:ro
      - ../../services/worker/src/reno_worker:/app/src/reno_worker:ro
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:3002/healthz', timeout=2).read()\""]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  scheduler:
    build:
      context: ../..
      dockerfile: services/worker/Dockerfile
    command: ["uv", "run", "python", "-m", "reno_worker"]
    environment:
      PORT: "3003"
      HOST: "0.0.0.0"
      DATABASE_URL: postgres://reno_news:reno_news@postgres:5432/reno_news
    volumes:
      - ../../services/worker/pyproject.toml:/app/pyproject.toml:ro
      - ../../services/worker/uv.lock:/app/uv.lock:ro
      - ../../services/worker/src/reno_worker:/app/src/reno_worker:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: reno_news
      POSTGRES_USER: reno_news
      POSTGRES_PASSWORD: reno_news
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reno_news -d reno_news"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
      worker:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
