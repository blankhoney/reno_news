name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  javascript:
    name: JavaScript lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint JavaScript packages
        run: pnpm lint

      - name: Test JavaScript packages
        run: pnpm test

      - name: Build JavaScript packages
        run: pnpm build

  python-worker:
    name: Python worker tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Verify worker lockfile
        working-directory: services/worker
        run: uv lock --check

      - name: Test Python worker
        working-directory: services/worker
        run: uv run python -m unittest discover -s tests

      - name: Run fake AI golden-set harness
        run: uv --project services/worker run python -m reno_worker.golden_eval --fixture services/worker/golden/ai_evaluation_golden.jsonl --provider fake

  database-integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: reno_news
          POSTGRES_USER: reno_news
          POSTGRES_PASSWORD: reno_news
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reno_news -d reno_news"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://reno_news:reno_news@localhost:5432/reno_news
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate database
        run: pnpm db:migrate

      - name: Seed database
        run: pnpm db:seed

      - name: Run DB integration tests
        run: pnpm --filter @reno-news/db test:integration

  docker-compose-config:
    name: Docker Compose config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Render development Compose config
        run: docker compose -f infra/compose/compose.yml config

      - name: Verify production Compose public boundary
        run: node scripts/check-production-compose.mjs

      - name: Verify production deploy contract
        run: node scripts/check-deploy-contract.mjs

      - name: Verify off-host backup contract
        run: node scripts/check-offhost-backup-contract.mjs

      - name: Verify alert rules contract
        run: node scripts/check-alert-rules.mjs

      - name: Verify AI provider contract
        run: node scripts/check-ai-provider-contract.mjs

      - name: Verify GitHub source policy contract
        run: node scripts/check-github-source-policy.mjs
